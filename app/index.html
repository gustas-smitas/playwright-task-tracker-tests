<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Task Tracker</title>
  <style>
    body { font: 18px system-ui; background: #eef2f6; color: #182536; margin: 0; }
    main { max-width: 640px; margin: 60px auto; padding: 32px; background: white; border-radius: 16px; }
    label { display: block; margin-bottom: 8px; }
    input, button { font: inherit; padding: 10px; }
    button { cursor: pointer; }
    nav { display: flex; gap: 8px; margin: 24px 0; }
    button[aria-pressed="true"] { background: #182536; color: white; }
    ul { padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #ddd; }
    li label { flex: 1; margin: 0; }
    li:has(:checked) span { text-decoration: line-through; }
    [role="alert"] { color: #a32020; }
  </style>
</head>
<body>
<main>
  <h1>Task Tracker</h1>
  <form novalidate>
    <label for="task">New task</label>
    <input id="task" autocomplete="off" placeholder="What needs doing?">
    <button>Add task</button>
    <p role="alert" id="error" hidden></p>
  </form>
  <nav aria-label="Task filters">
    <button type="button" aria-pressed="true">All</button>
    <button type="button" aria-pressed="false">Active</button>
    <button type="button" aria-pressed="false">Completed</button>
  </nav>
  <p role="status" id="count"></p>
  <p id="empty">No tasks here.</p>
  <ul aria-label="Tasks"></ul>
  <h2>Daily tip</h2>
  <button type="button" id="tip-button">Get tip</button>
  <p id="tip" aria-live="polite"></p>
</main>
<script>
  const tasks = [];
  let filter = 'All';
  const list = document.querySelector('ul');
  const input = document.querySelector('#task');
  const error = document.querySelector('#error');
  function render() {
    list.replaceChildren();
    const visible = tasks.filter(t => filter === 'All' || (filter === 'Completed' ? t.done : !t.done));
    document.querySelector('#empty').hidden = visible.length > 0;
    const remaining = tasks.filter(t => !t.done).length;
    document.querySelector('#count').textContent = `${remaining} active ${remaining === 1 ? 'task' : 'tasks'}`;
    for (const task of visible) {
      const row = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => { task.done = checkbox.checked; render(); });
      const text = document.createElement('span');
      text.textContent = task.title;
      label.append(checkbox, text);
      const remove = document.createElement('button');
      remove.textContent = 'Delete';
      remove.setAttribute('aria-label', `Delete ${task.title}`);
      remove.addEventListener('click', () => { tasks.splice(tasks.indexOf(task), 1); render(); });
      row.append(label, remove);
      list.append(row);
    }
  }
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const title = input.value.trim();
    error.hidden = !!title;
    if (!title) { error.textContent = 'Enter a task name.'; return; }
    tasks.push({ title, done: false });
    input.value = '';
    render();
    input.focus();
  });
  document.querySelectorAll('nav button').forEach(button => button.addEventListener('click', () => {
    filter = button.textContent;
    document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
    render();
  }));
  document.querySelector('#tip-button').addEventListener('click', async () => {
    const tip = document.querySelector('#tip');
    tip.textContent = 'Loading tip…';
    try {
      const response = await fetch('/api/tip');
      if (!response.ok) throw new Error('Request failed');
      tip.textContent = (await response.json()).tip;
    } catch { tip.textContent = 'Could not load tip. Try again.'; }
  });
  render();
</script>
</body>
</html>
